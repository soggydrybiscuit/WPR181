<!DOCTYPE html>
<html lang="en">
<head>
    <style> .details{list-style-type: circle;}
        .specific {list-style-type: square;}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nested List</title>
</head>
<body>
    <ul>
        <li>Fruit
            <ul class="details">
                <li>Bananas</li>
                <li>Apples
                    <ul class="specific">
                        <li>Green</li>
                        <li>Red</li>
                    </ul>
                </li>
                <li>Pears</li>
            </ul>
        </li>
        <li>Vegetables</li>
        <li>Meat</li>
    </ul>
</body>
</html>
